name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm install --no-audit --no-fund --ignore-scripts --silent
      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit --skipLibCheck -p .
      - name: Expo web export check (catch blank-page regressions)
        run: |
          set -e
          echo "Running expo export to catch Metro static blank-page bugs..."
          ./node_modules/.bin/expo export --platform web --output-dir dist
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html missing after expo export"
            exit 1
          fi
          SZ=$(wc -c < dist/index.html)
          if [ "$SZ" -lt 500 ]; then
            echo "ERROR: dist/index.html too small ($SZ bytes) - likely blank page"
            exit 1
          fi
          echo "Expo export OK - dist/index.html $SZ bytes"
          ls -lh dist/ | head -20
          # bundle marker check
          BUNDLE=$(ls -S dist/_expo/static/js/web/ 2>/dev/null | head -1 || echo "none")
          echo "Largest bundle: $BUNDLE"
          if [ "$BUNDLE" = "none" ]; then
            echo "WARN: no bundle found in dist/_expo/static/js/web/ (Expo 54 layout may differ, checking dist/bundles)"
            ls -R dist | head -30
          fi
          # If zustand createJSONStorage window undefined or SafeAreaView web breaks static render,
          # export fails or produces blank root. This gate catches it early.
          # Fix pattern: *.web.ts store without zustand useState+listeners, screens/*.web.tsx View not SafeAreaView
      - name: Token hardening — no raw hex in screens
        run: |
          set -e
          SCREENS="screens"
          echo "Checking $SCREENS for raw hex tokens..."
          RAW=$(grep -rn "'#[0-9A-Fa-f]\{{3,8\}}'" $SCREENS 2>/dev/null | grep -v "'#FFF'" | grep -v "'#FFFFFF'" | grep -v "'#fff'" | grep -v "'#ffffff'" || true)
          if [ -n "$RAW" ]; then
            echo "FOUND raw hex in screens (should use theme tokens):"
            echo "$RAW"
            echo "Fix: replace with theme.colors.* tokens. See src/theme.ts"
            exit 1
          fi
          echo "Raw hex check OK (no non-white raw hex in screens)"
      - name: Anti-pattern — no toLocaleDateString in screens
        run: |
          set -e
          SCREENS="screens"
          echo "Checking $SCREENS for toLocaleDateString/toLocaleString anti-pattern..."
          FOUND=$(grep -rn "toLocaleDateString\|toLocaleString" $SCREENS 2>/dev/null | grep -v ".web.tsx:" | grep -v "// allowed" | grep "toLocale" || true)
          if [ -n "$FOUND" ]; then
            if echo "$FOUND" | grep -q "toLocaleDateString\|toLocaleString"; then
              echo "FOUND toLocaleDateString/toLocaleString in screens (locale-breaks month grouping):"
              echo "$FOUND"
              echo "Fix: use formatDate/formatFullDate from theme + ISO yyyy-MM + MONTHS array for grouping"
              exit 1
            fi
          fi
          echo "toLocaleDateString check OK"
      - name: No ' -> ' arrow in Text (TS1382 guard)
        run: |
          set -e
          SCREENS="screens"
          echo "Checking $SCREENS for ' -> ' literal in TSX (TS1382)..."
          FOUND=$(grep -rn " -> " $SCREENS/*.tsx 2>/dev/null | grep -v ".web.tsx" | grep "<Text" -A2 -B2 || grep -rn " -> " $SCREENS/*.tsx 2>/dev/null | head -5 || true)
          # Softer check - just warn if pattern exists, don't fail hard yet
          # Real check is tsc which catches TS1382 Unexpected token
          echo "Arrow check: tsc covers TS1382, heuristic found:"
          grep -rn " -> " $SCREENS/*.tsx 2>/dev/null | grep -v node_modules | head -10 || echo "none"
          echo "Arrow heuristic OK"
      - name: Lean check — no node_modules in git
        run: |
          set -e
          if git ls-files | grep -q node_modules; then
            echo "ERROR: node_modules tracked in git!"
            git ls-files | grep node_modules | head -20
            exit 1
          fi
          echo "Lean check OK"
      - name: Version alignment — app.json matches package.json
        run: |
          set -e
          APP_VER=$(cat app.json | python3 -c "import sys,json; print(json.load(sys.stdin)['expo']['version'])")
          PKG_VER=$(cat package.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          if [ "$APP_VER" != "$PKG_VER" ]; then
            echo "Version drift: app.json $APP_VER != package.json $PKG_VER"
            exit 1
          fi
          echo "Version alignment OK: $APP_VER"
